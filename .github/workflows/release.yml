# Release-Pakete für Linux, Windows und macOS
# Release packages for Linux, Windows and macOS
#
# Auslöser / triggers:
#   - ein Tag `v*` (z. B. `git tag v0.3.0 && git push origin v0.3.0`): baut alle drei
#     Pakete und hängt sie an ein GitHub-Release dieses Tags
#   - von Hand (Actions → Release → Run workflow): baut nur, die Pakete liegen als
#     Artefakte am Lauf (zum Testen)
#
# Windows wird in MSYS2 (UCRT64) gebaut, macOS mit Homebrew; die GTK-Laufzeit
# legen die Skripte aus RUF dazu (tools/bundle-*.sh) – vom selben RUF-Stand, den
# Cargo.lock festhält. Das Linux-Paket braucht GTK 4 (≥ 4.12) und GtkSourceView 5
# vom System.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4 und GtkSourceView 5
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtksourceview-5-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bauen
        run: cargo build --release --locked
      # Aufbau wie unter /usr (bin/, share/): passt für den DS-Launcher
      # (/opt/dragon-software/ct-editor) und für ein AUR-Paket ct-editor-bin.
      # Layout like /usr (bin/, share/): fits the DS-Launcher and ct-editor-bin.
      - name: Paket
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          dir=ct-editor-$version-linux-x86_64
          install -Dm755 target/release/ct-editor $dir/bin/ct-editor
          install -Dm644 assets/ct-editor.desktop $dir/share/applications/ct-editor.desktop
          for icon in assets/icons/ct-editor-*.png; do
            size=${icon##*-}; size=${size%.png}
            install -Dm644 $icon $dir/share/icons/hicolor/${size}x${size}/apps/ct-editor.png
          done
          install -Dm644 assets/ct-editor.svg $dir/share/icons/hicolor/scalable/apps/ct-editor.svg
          mkdir -p $dir/share/doc/ct-editor
          cp -r README.md LICENSE-MIT LICENSE-APACHE docs $dir/share/doc/ct-editor/
          tar czf $dir.tar.gz $dir
          echo "PACKAGE=$dir.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ${{ env.PACKAGE }}

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      # Die Bundle-Skripte (tools/) liegen nicht im crates.io-Paket: aus dem
      # RUF-Repository zum Tag der verwendeten Version (v<Version> aus Cargo.lock).
      - name: RUF-Version aus Cargo.lock
        id: ruf
        shell: bash
        run: echo "tag=v$(grep -A1 '^name = "ruf"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Freya-TDE/RUF
          ref: ${{ steps.ruf.outputs.tag }}
          path: ruf
      # Rust mit GNU-Host (passt zu MSYS2; das MSVC-Rust würde für das GNU-Ziel
      # cross-kompilieren, und pkg-config der GTK-Crates verweigert das).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # Rust von rustup (Windows) soll in der MSYS2-Shell sichtbar sein.
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            zip
      - uses: Swatinem/rust-cache@v2
      - name: Bauen
        run: cargo build --release --locked
      - name: Paket mit GTK-Laufzeit
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          dir=ct-editor-$version-windows-x86_64
          ruf/tools/bundle-windows.sh target/release/ct-editor.exe \
              $dir docs LICENSE-MIT LICENSE-APACHE README.md
          zip -qr $dir.zip $dir
          echo "PACKAGE=$dir.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ env.PACKAGE }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Die Bundle-Skripte (tools/) liegen nicht im crates.io-Paket: aus dem
      # RUF-Repository zum Tag der verwendeten Version (v<Version> aus Cargo.lock).
      - name: RUF-Version aus Cargo.lock
        id: ruf
        run: echo "tag=v$(grep -A1 '^name = "ruf"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: Freya-TDE/RUF
          ref: ${{ steps.ruf.outputs.tag }}
          path: ruf
      - name: GTK 4 und Werkzeuge
        run: brew install gtk4 gtksourceview5 adwaita-icon-theme dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bauen
        run: cargo build --release --locked
      - name: Paket als .app
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          dir=ct-editor-$version-macos-arm64
          mkdir -p $dir
          ruf/tools/bundle-macos.sh target/release/ct-editor $dir/CT-Editor.app \
              net.dragon-software.ct-editor assets/ct-editor.icns
          cp -r docs README.md LICENSE-MIT LICENSE-APACHE $dir/
          ditto -c -k --keepParent $dir $dir.zip
          echo "PACKAGE=$dir.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ env.PACKAGE }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*
          generate_release_notes: true

  # Homebrew-Formel im Tap Freya-TDE/homebrew-tap auf die neue Version setzen
  # (Adresse und SHA-256 des Quell-Archivs). Braucht das Secret
  # HOMEBREW_TAP_TOKEN: ein Fine-grained Token mit "Contents: Read and write"
  # nur für Freya-TDE/homebrew-tap. Ohne Secret wird der Schritt übersprungen.
  # Update the Homebrew formula in Freya-TDE/homebrew-tap (URL and SHA-256 of the
  # source archive). Needs the secret HOMEBREW_TAP_TOKEN (fine-grained token,
  # "Contents: Read and write" on Freya-TDE/homebrew-tap only); skipped without it.
  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Token vorhanden?
        id: token
        run: echo "present=${{ env.TAP_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          repository: Freya-TDE/homebrew-tap
          token: ${{ env.TAP_TOKEN }}
          path: tap
      - name: Formel aktualisieren
        if: steps.token.outputs.present == 'true'
        run: |
          tag=${GITHUB_REF_NAME}
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          sha=$(curl -sSLf "$url" | sha256sum | cut -d' ' -f1)
          formula=tap/Formula/ct-editor.rb
          sed -i -E "s|^  url \".*\"|  url \"${url}\"|; s|^  sha256 \".*\"|  sha256 \"${sha}\"|" "$formula"
          cd tap
          if git diff --quiet; then echo "Formel ist schon aktuell"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ct-editor ${tag#v}"
          git push

  # Den Katalog neu bauen lassen (DS-Catalog, Workflow „Katalog“). Braucht das
  # Secret CATALOG_TOKEN (Contents read/write auf Dragon-InterActive/DS-Catalog).
  # Ask DS-Catalog to rebuild the catalog; needs the secret CATALOG_TOKEN.
  catalog:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    env:
      CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
    steps:
      - name: Katalog anstoßen
        if: env.CATALOG_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $CATALOG_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Dragon-InterActive/DS-Catalog/dispatches \
            -d "{\"event_type\":\"release\",\"client_payload\":{\"program\":\"ct-editor\",\"version\":\"${GITHUB_REF_NAME#v}\"}}"
